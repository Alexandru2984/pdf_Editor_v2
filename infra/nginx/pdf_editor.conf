# Host nginx vhost for pdf.micutu.com.
#
# Requires the global host files managed outside this repository:
#   /etc/nginx/conf.d/cloudflare-realip.conf
#   /etc/nginx/conf.d/cloudflare-origin-guard.conf
# The first trusts Cloudflare's published edge ranges for CF-Connecting-IP;
# the second defines $from_cloudflare_origin from the original TCP peer.

map $uri $pdf_static_cache_control {
    default                         "public, max-age=3600";
    ~*\.[0-9a-f]{12}\.[^/]+$       "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.micutu.com;

    # Permit Cloudflare and loopback-only maintenance probes. Refuse direct
    # public access to the origin so clients cannot bypass WAF/rate limits or
    # inject their own X-Forwarded-For chain.
    if ($from_cloudflare_origin = 0) { return 403; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf.micutu.com;
    server_tokens off;

    # Compress text assets on the origin→Cloudflare hop. Versioned files get
    # immutable caching; source-name fallbacks stay short-lived so service
    # workers and manifests cannot pin an old deployment for a year.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    if ($from_cloudflare_origin = 0) { return 403; }

    # Django accepts 10 MiB PDFs; retain multipart framing headroom without
    # allowing the previous 100 MiB request-body amplification at the edge.
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/pdf.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Public application assets only. User PDFs are never exposed by an
    # nginx alias; all /media/ requests go through Django ownership checks.
    location /static/ {
        alias /home/micu/pdf_Editor_v2/staticfiles/;
        add_header Cache-Control $pdf_static_cache_control always;
        access_log off;
    }

    # SSE job progress stream: disable buffering and allow long-lived connections.
    location ~ ^/(?:(?:en|ro)/)?jobs/[0-9a-f-]+/events/?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_hide_header X-Upstream;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # cloudflare-realip.conf has already replaced $remote_addr with the
        # verified CF-Connecting-IP value. Replace, never append to, the
        # client-supplied chain at this first controlled proxy boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 80s;
        proxy_send_timeout 80s;

        # Defence in depth during mixed-version rollouts.
        proxy_hide_header X-Upstream;
    }
}
