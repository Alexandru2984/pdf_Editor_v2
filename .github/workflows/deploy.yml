name: build-and-deploy

on:
  # Run after the tests workflow completes. workflow_run guarantees we only
  # fire once tests has actually finished, avoiding the race where both
  # workflows start in parallel on push and the deploy gets ahead.
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1. Build a docker image and push it to GitHub Container Registry.
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC token for cosign keyless image signing (sigstore).
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
      image_digest: ${{ steps.build.outputs.digest }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      # workflow_run events default to the latest commit on the default branch.
      # We want the exact SHA that the tests workflow validated, so check out
      # head_sha when triggered by workflow_run.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        env:
          # Use head_sha from the workflow_run payload so the image tag
          # matches the commit that actually passed tests.
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          short_sha="sha-$(echo "$COMMIT_SHA" | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          # Image name is forced lowercase per OCI rules.
          repo_lower="$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          # Daily cache-bust token for the apt layer (see Dockerfile).
          echo "apt_refresh_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          # Pass today's date so the apt layer is rebuilt daily and picks
          # up fresh Debian security patches — otherwise the cached layer
          # ships stale packages and Trivy fails the build on new CVEs.
          build-args: |
            APT_REFRESH_DATE=${{ steps.meta.outputs.apt_refresh_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerability scan on the freshly-built image. Fails the job on
      # HIGH/CRITICAL OS or library CVEs so we don't ship a known-vulnerable
      # container to prod. Pinned to the image we just pushed by short_sha.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # Software Bill of Materials for the exact image we ship — auditors
      # (and future-us) can answer "did we ever ship libfoo 1.2?" without
      # rebuilding. Stored as a build artifact next to the run.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          format: spdx-json
          artifact-name: sbom-${{ steps.meta.outputs.short_sha }}.spdx.json

      # Keyless (OIDC) signature over the image digest. Verifiable with:
      #   cosign verify ghcr.io/<repo>@<digest> \
      #     --certificate-identity-regexp 'github.com/<repo>' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # 2. SSH into the VPS and deploy the exact signed digest that passed tests.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            # Authenticate to GHCR with a personal access token that has read:packages.
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_PULL_USER }} --password-stdin
            ./scripts/deploy.sh \
              '${{ needs.build.outputs.image_tag }}' \
              '${{ needs.build.outputs.image_digest }}' \
              '${{ needs.build.outputs.commit_sha }}'
